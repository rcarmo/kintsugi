name: CI
on:
  # Coordination pushes are CI-free; release.yml invokes full checks for version tags.
  pull_request:
    paths-ignore:
      - "docs/**"
      - "notes/**"
      - ".github/**"
      - "**/*.md"
      - "LICENSE"
      - "NOTICE"
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  check:
    name: Select / check / test (AMD64)
    runs-on: ubuntu-24.04
    # Package mirrors can take over 12 minutes before the full runtime suite starts.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Classify changes (tags and unknown bases require all checks)
        id: changes
        run: |
          base='${{ github.event.pull_request.base.sha || github.event.before }}'
          required=true
          gateway=true
          if [ '${{ github.ref_type }}' != tag ] && [ '${{ github.event_name }}' != workflow_dispatch ] && [ -n "$base" ] && git fetch --depth=1 origin "$base"; then
            git diff --name-only "$base" HEAD > changed-files.txt
            if ! grep -q '^packages/workspace-image/workspace-image/gateway/' changed-files.txt; then gateway=false; fi
            if [ -s changed-files.txt ] && ! grep -q "^docs/deploy-in-workspace/" changed-files.txt && ! grep -Ev '^(docs/|notes/|readme\.md$|AGENTS\.md$|LICENSE$)' changed-files.txt; then
              required=false
            fi
          fi
          {
            echo "required=$required"
            echo "gateway=$gateway"
          } >> "$GITHUB_OUTPUT"
          echo "## Check selection" >> "$GITHUB_STEP_SUMMARY"
          echo "Runtime checks required: $required. Tags and unknown bases run all checks; ordinary pushes do not trigger CI; documentation-only pull requests are skipped." >> "$GITHUB_STEP_SUMMARY"
      - name: Validate all workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        if: "steps.changes.outputs.required == 'true'"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
        if: "steps.changes.outputs.required == 'true'"
      - name: Restore Bun downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: "bun-${{ runner.os }}-${{ runner.arch }}-1.4.4-${{ hashFiles('**/bun.lock', 'patches/**') }}"
          restore-keys: "bun-${{ runner.os }}-${{ runner.arch }}-1.4.4-"
        if: "steps.changes.outputs.required == 'true'"
      - name: Install locked dependencies
        run: bun ci
        if: "steps.changes.outputs.required == 'true'"
      - name: Lint and type-check
        run: bun run check
        if: "steps.changes.outputs.required == 'true'"
      - name: Set up Go for workspace-helper tests and gateway checks
        if: steps.changes.outputs.required == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: |
            packages/workspace-helper/helper/go.sum
            packages/workspace-image/workspace-image/gateway/go.mod
      - name: Check gateway formatting and tests before expensive stages
        if: steps.changes.outputs.gateway == 'true'
        working-directory: packages/workspace-image/workspace-image/gateway
        run: |
          test -z "$(gofmt -l .)"
          go test ./...
      - name: Restore Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: "playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}"
        if: "steps.changes.outputs.required == 'true'"
      - name: Provision only missing test dependencies
        run: |
          missing=()
          for tool in socat tmux ffmpeg; do
            if ! command -v "$tool"; then missing+=("$tool"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi
          sudo mkdir -p /work
          sudo chmod 1777 /work
          bun node_modules/@playwright/test/cli.js install chromium
          browser=$(bun -e 'import { chromium } from "@playwright/test"; console.log(chromium.executablePath())')
          if ldd "$browser" | grep 'not found'; then
            bun node_modules/@playwright/test/cli.js install-deps chromium
          fi
          # Real helper fixtures drop root to agent; keep their files owned by
          # that same unprivileged UID without running the whole suite as root.
          if ! id agent >/dev/null 2>&1; then
            sudo useradd --non-unique --uid "$(id -u)" --gid "$(id -g)" --no-create-home --home-dir "$HOME" --shell /bin/bash agent
          fi
          test "$(id -u agent)" = "$(id -u)"
        if: "steps.changes.outputs.required == 'true'"
      - name: Match the shipped tmux runtime
        if: "steps.changes.outputs.required == 'true'"
        run: |
          # Match workspace terminals built from the pinned tmux 3.8 release.
          sudo apt-get update
          sudo apt-get install -y libevent-dev libncurses-dev bison
          curl --fail --location --silent --show-error https://github.com/tmux/tmux/releases/download/3.8/tmux-3.8.tar.gz -o "$RUNNER_TEMP/tmux.tar.gz"
          echo "e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e  $RUNNER_TEMP/tmux.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/tmux.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/tmux-3.8"
          ./configure --prefix=/usr/local
          make -j2
          sudo make install
          test "$(tmux -V)" = 'tmux 3.8'
      - name: Run the full test suite
        run: |
          bun run generate:workspace-modules
          # Existing installer fixtures require root; helper integration fixtures
          # instead need files owned by the unprivileged agent identity.
          sudo --preserve-env=PATH "$(command -v bun)" run test:parallel
          bun run test:native
        if: "steps.changes.outputs.required == 'true'"
      - name: Verify helper root permission boundaries
        working-directory: packages/workspace-helper/helper
        run: "sudo --preserve-env=PATH \"$(command -v go)\" test ./..."
        if: "steps.changes.outputs.required == 'true'"
      - name: Record verification
        if: always()
        run: |
          {
            echo '## Verification'
            echo 'Commit: ${{ github.sha }}'
            echo 'Result: ${{ job.status }}; runtime checks requested: ${{ steps.changes.outputs.required }}. Full tests run once on AMD64; native ARM64 image execution is checked by the image workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
