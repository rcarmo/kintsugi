name: Verified Go runtime

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full main commit to build; publishes only immutable SHA tags
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-images-publication
  cancel-in-progress: false

jobs:
  native:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            machine: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            machine: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Validate immutable source and native machine
        id: source
        env:
          REVISION: ${{ inputs.revision }}
          OWNER: ${{ github.repository_owner }}
        run: |
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]]
          test "$REVISION" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
          test "$(uname -m)" = '${{ matrix.machine }}'
          repository=$(bun -e 'import {runtimeRepository} from "./packages/shared/src/publishing.ts";process.stdout.write(runtimeRepository)')
          test "$repository" = "ghcr.io/${OWNER,,}/kintsugi-docker"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          bun -e 'import {imageSource} from "./packages/shared/src/publishing.ts";console.log("source="+imageSource)' >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Enable required kernel filesystems for native smoke tests
        run: |
          sudo modprobe erofs
          sudo modprobe loop
          grep -w erofs /proc/filesystems
      - name: Build and verify every shipped Go binary
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: images/patched-docker
          platforms: linux/${{ matrix.arch }}
          load: true
          push: true
          provenance: false
          tags: ${{ steps.source.outputs.repository }}:sha-${{ inputs.revision }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ steps.source.outputs.source }}
            org.opencontainers.image.revision=${{ inputs.revision }}
      - name: Native runtime smoke test
        env:
          REF: ${{ steps.source.outputs.repository }}@${{ steps.image.outputs.digest }}
        run: bun images/patched-docker/smoke-test.ts "$REF" 'linux/${{ matrix.arch }}'
      - name: Record verified immutable dependency
        env:
          REF: ${{ steps.source.outputs.repository }}@${{ steps.image.outputs.digest }}
          DIGEST: ${{ steps.image.outputs.digest }}
          REVISION: ${{ inputs.revision }}
          ARCH: ${{ matrix.arch }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir receipts
          jq -n --arg ref "$REF" --arg digest "$DIGEST" --arg revision "$REVISION" --arg arch "$ARCH" '{ref:$ref,digest:$digest,revision:$revision,arch:$arch,go:"go1.27.3"}' > "receipts/$ARCH.json"
          container=$(docker create --network none "$REF")
          trap 'docker rm -v "$container"' EXIT
          docker cp "$container:/usr/share/kintsugi-patched-docker/go-build-info.txt" "receipts/$ARCH-go-build-info.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-${{ matrix.arch }}
          path: receipts/

  manifest:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: runtime-*
          merge-multiple: true
          path: receipts
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Assemble only the verified native slices; never change latest or stable
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          repository=$(bun -e 'import {runtimeRepository} from "./packages/shared/src/publishing.ts";process.stdout.write(runtimeRepository)')
          refs=()
          for arch in amd64 arm64; do
            jq -e --arg revision "$REVISION" --arg arch "$arch" '.revision==$revision and .arch==$arch and .go=="go1.27.3"' "receipts/$arch.json"
            digest=$(jq -er .digest "receipts/$arch.json")
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            refs+=("$repository@$digest")
          done
          ref="$repository:sha-$REVISION"
          docker buildx imagetools create --tag "$ref" "${refs[@]}"
          docker buildx imagetools inspect "$ref" --raw > receipts/manifest.json
          jq -e '([.manifests[].platform | select(.os=="linux") | .architecture] | sort)==["amd64","arm64"]' receipts/manifest.json
          digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -er .digest)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf '%s@%s\n' "$repository" "$digest" > receipts/runtime-image
          cat receipts/runtime-image >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-runtime
          path: receipts/
